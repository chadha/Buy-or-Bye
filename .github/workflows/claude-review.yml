# Automatic review of every PR, posted as inline comments (uses the code-review plugin).
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Authenticate through GitHub OIDC and Anthropic Workload Identity Federation.
          # No ANTHROPIC_API_KEY secret is required.
          anthropic_federation_rule_id: fdrl_014Q2rQnXEgVmQHocuY617J4
          anthropic_organization_id: 17f6d746-da46-4a40-9f51-d498cdf959e2
          anthropic_service_account_id: svac_01PChLH3jNiUWqAa3LsHeW5M
          anthropic_workspace_id: wrkspc_0154uwz8uiBTk4G7kn3SJUwH
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
